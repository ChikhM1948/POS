services:
  - type: web
    name: pos-dz-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @pos-dz/shared && npm run build --workspace @pos-dz/api
    startCommand: npm run start --workspace @pos-dz/api
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_ADMIN_KEY
        sync: false
      # Mises à jour desktop : sur un volume persistant (disque Render, plan payant) — sinon les fichiers
      # publiés disparaissent à chaque redéploiement.
      - key: UPDATES_DIR
        value: /var/data/updates
