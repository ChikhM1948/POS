# CasaOS : « Installer une appli personnalisée » > importer ce fichier (ou `docker compose up -d`).
# Puis, dans le tunnel Cloudflare, ajoutez un hostname public (ex. updates.votredomaine.dz) -> http://<ip-casaos>:4100
services:
  pos-updates:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    command: sh -c "[ -d node_modules/express ] || npm install --no-audit --no-fund express@4; node server.js"
    environment:
      PORT: "4100"
      UPDATES_DIR: /data
      LICENSE_ADMIN_KEY: ${LICENSE_ADMIN_KEY:?définir LICENSE_ADMIN_KEY}
    ports:
      - "4100:4100"
    volumes:
      - ./server.js:/app/server.js:ro
      - ./app_modules:/app/node_modules   # cache npm persistant
      - /DATA/AppData/pos-updates:/data   # installeurs publiés (persistant)
